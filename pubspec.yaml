name: jakim_hm_tracker
description: "JAKIM 2027 Half Marathon Training Tracker & AI Coach for Muhammad Adlan Jazuli"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.2
  http: ^1.2.1
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.3
  share_plus: ^9.0.0
  flutter_secure_storage: ^9.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/training_schedule.json
    - assets/images/exercises/
