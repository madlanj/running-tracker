name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Scaffold Official Flutter Android Project
        run: |
          rm -rf android/
          flutter create . --platforms=android --org com.adlan --project-name jakim_hm_tracker

      - name: Inject Android Permissions & Strava Callback
        run: |
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              content = f.read()

          permissions = '''
    <uses-permission android:name=\"android.permission.INTERNET\"/>
    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>
    <uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\"/>
    <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\"/>
    <uses-permission android:name=\"android.permission.VIBRATE\"/>
  '''
          strava_intent = '''
            <intent-filter>
                <action android:name=\"android.intent.action.VIEW\" />
                <category android:name=\"android.intent.category.DEFAULT\" />
                <category android:name=\"android.intent.category.BROWSABLE\" />
                <data android:scheme=\"jakimtracker\" android:host=\"strava-callback\" />
            </intent-filter>
  '''
          content = content.replace('<application', permissions + '\n    <application')
          content = content.replace('</activity>', strava_intent + '\n        </activity>')

          with open(manifest_path, 'w', encoding='utf-8') as f:
              f.write(content)
          print('Successfully injected permissions and Strava intent filter into official AndroidManifest.xml')
          "

      - name: Generate Training Assets & Illustrations
        run: python3 tool/generate_assets.py

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JAKIM_2027_Tracker_Release_APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
